<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東京都立小台橋高等学校 - 部活動フォトギャラリー</title>
  <style>
    :root {
      --bg-color: #ffffff; /* 背景を白に変更 */
      --card-bg: #ffffff;
      --card-radius: 20px;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      --text-main: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1200px;
    }

    /* Bento Grid Layout */
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      grid-auto-rows: 180px;
      gap: 1.25rem;
    }

    @media (min-width: 768px) {
      .bento-grid {
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: 200px;
      }

      .col-span-2 { grid-column: span 2; }
      .row-span-2 { grid-row: span 2; }
      .large {
        grid-column: span 2;
        grid-row: span 2;
      }
    }

    /* カードスタイル */
    .bento-card {
      position: relative;
      border-radius: var(--card-radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      background-color: var(--card-bg);
      border: 1px solid rgba(0, 0, 0, 0.06);
    }

    /* 画像スタイル */
    .bento-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 文字を読みやすくするための下部グラデーション */
    .bento-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0.2) 40%, transparent 100%);
      pointer-events: none;
    }

    /* 部活動名ラベル */
    .card-label {
      position: absolute;
      bottom: 1rem;
      left: 1rem;
      right: 1rem;
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 700;
      z-index: 2;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s ease;
    }

    /* ホバー時のズーム */
    .bento-card:hover img {
      transform: scale(1.08);
    }

    .bento-card:hover .card-label {
      transform: translateY(-2px);
    }

    /* 詳細モーダル（ポップアップ） */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 1000;
      padding: 1.5rem;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      position: relative;
      background-color: #ffffff;
      border-radius: 20px;
      max-width: 500px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      transform: translateY(20px);
      transition: transform 0.3s ease;
      color: var(--text-main);
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    .modal-content img {
      width: 100%;
      height: 240px;
      object-fit: cover;
    }

    .modal-body {
      padding: 1.5rem;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: var(--text-main);
    }

    .modal-desc {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #475569;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 16px;
      color: #ffffff;
      font-size: 2rem;
      background: rgba(0, 0, 0, 0.5);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="bento-grid">

      <!-- バスケットボール部 -->
      <div class="bento-card large" data-title="バスケットボール部" data-desc="チームワークを大切に、日々体育館で練習を重ねています。初心者・経験者問わず歓迎！">
        <img src="https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=800&q=80" alt="バスケットボール部">
        <div class="card-label">バスケットボール部</div>
      </div>

      <!-- 軽音楽部（ギター） -->
      <div class="bento-card row-span-2" data-title="軽音楽部" data-desc="バンドごとに好きな曲をコピーしたりオリジナル曲を作ったりしてライブを行っています。">
        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=600&q=80" alt="軽音楽部">
        <div class="card-label">軽音楽部</div>
      </div>

      <!-- 科学部 -->
      <div class="bento-card" data-title="科学部" data-desc="身近な疑問をテーマに実験を行い、日常の科学を探求しています。">
        <img src="https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&w=600&q=80" alt="科学部">
        <div class="card-label">科学部</div>
      </div>

      <!-- バレーボール部 -->
      <div class="bento-card" data-title="バレーボール部" data-desc="声を掛け合いながら基本技術と対人レシーブの向上を目指しています。">
        <img src="https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?auto=format&fit=crop&w=600&q=80" alt="バレーボール部">
        <div class="card-label">バレーボール部</div>
      </div>

      <!-- バドミントン部 -->
      <div class="bento-card col-span-2" data-title="バドミントン部" data-desc="フットワークやスマッシュなど、個々の技術を高めながら楽しく汗を流しています。">
        <img src="https://images.unsplash.com/photo-1626224583764-f87db24ac4ea?auto=format&fit=crop&w=800&q=80" alt="バドミントン部">
        <div class="card-label">バドミントン部</div>
      </div>

      <!-- 卓球部 -->
      <div class="bento-card" data-title="卓球部" data-desc="ラリーの楽しさを味わいながら、基本練習と試合形式を並行して実施中。">
        <img src="https://images.unsplash.com/photo-1534158914592-062992fbe900?auto=format&fit=crop&w=600&q=80" alt="卓球部">
        <div class="card-label">卓球部</div>
      </div>

      <!-- 美術部 -->
      <div class="bento-card row-span-2" data-title="美術部" data-desc="イラスト、油絵、立体制作など、それぞれが自由な作品制作に取り組んでいます。">
        <img src="https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=600&q=80" alt="美術部">
        <div class="card-label">美術部</div>
      </div>

      <!-- パソコン部 -->
      <div class="bento-card" data-title="パソコン部" data-desc="タイピングやWebサイト制作、簡単なプログラミングを楽しく学んでいます。">
        <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=600&q=80" alt="パソコン部">
        <div class="card-label">パソコン部</div>
      </div>

      <!-- 吹奏楽部（金管楽器） -->
      <div class="bento-card col-span-2" data-title="吹奏楽部" data-desc="コンクールや文化祭での演奏に向けて、金管・木管・打楽器それぞれの音色を合わせて日々楽しく練習に励んでいます。">
        <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=800&q=80" alt="吹奏楽部">
        <div class="card-label">吹奏楽部</div>
      </div>

      <!-- ダンス部 -->
      <div class="bento-card" data-title="ダンス部" data-desc="リズム感を養いながら、文化祭ステージでのパフォーマンスを目指します。">
        <img src="https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?auto=format&fit=crop&w=600&q=80" alt="ダンス部">
        <div class="card-label">ダンス部</div>
      </div>

      <!-- ゴルフ部 -->
      <div class="bento-card" data-title="ゴルフ部" data-desc="きれいなスイングフォームの習得を目指して基礎練習を行っています。">
        <img src="https://images.unsplash.com/photo-1535131749006-b7f58c99034b?auto=format&fit=crop&w=600&q=80" alt="ゴルフ部">
        <div class="card-label">ゴルフ部</div>
      </div>

      <!-- 占い研究部 -->
      <div class="bento-card col-span-2" data-title="生徒会執行部" data-desc="タロットなどの設備が整っており、文化祭での活動は毎年恒例となっています。">
        <img src="https://www.free-materials.com/adm/wp-content/uploads/2021/04/adpDSC_3542-.jpg" alt="占い研究部">
        <div class="card-label">占い研究部</div>
      </div>

    </div>
  </div>

  <!-- タップ時の部活動紹介表示（モーダル） -->
  <div id="image-modal" class="modal-overlay" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <img id="modal-img" src="" alt="部活動画像">
      <div class="modal-body">
        <h2 id="modal-title" class="modal-title"></h2>
        <p id="modal-desc" class="modal-desc"></p>
      </div>
    </div>
  </div>

  <script>
    // 各カードタップ時の動作
    document.querySelectorAll('.bento-card').forEach(card => {
      card.addEventListener('click', () => {
        const img = card.querySelector('img');
        const title = card.getAttribute('data-title');
        const desc = card.getAttribute('data-desc');

        document.getElementById('modal-img').src = img.src;
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-desc').innerText = desc;

        document.getElementById('image-modal').classList.add('active');
      });
    });

    function closeModal() {
      document.getElementById('image-modal').classList.remove('active');
    }
  </script>
</body>
</html>
