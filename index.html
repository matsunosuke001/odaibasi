<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東京都立小台橋高等学校 - 部活動フォトギャラリー</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-radius: 20px;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1200px;
    }

    /* Bento Grid Layout */
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      grid-auto-rows: 180px;
      gap: 1.25rem;
    }

    @media (min-width: 768px) {
      .bento-grid {
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: 200px;
      }

      /* サイズ調整用クラス */
      .col-span-2 { grid-column: span 2; }
      .row-span-2 { grid-row: span 2; }
      .large {
        grid-column: span 2;
        grid-row: span 2;
      }
    }

    /* カードスタイル */
    .bento-card {
      position: relative;
      border-radius: var(--card-radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      background-color: #1e293b;
    }

    /* 画像スタイル */
    .bento-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ホバー時の黒グラデーションオーバーレイ */
    .bento-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to top, rgba(0,0,0,0.4), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    /* ホバー時の動き */
    .bento-card:hover img {
      transform: scale(1.08);
    }

    .bento-card:hover::after {
      opacity: 1;
    }

    /* 拡大用モーダル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 1000;
      padding: 1.5rem;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
    }

    .modal-content img {
      width: 100%;
      height: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 12px;
    }

    .modal-close {
      position: absolute;
      top: -40px;
      right: 0;
      color: #ffffff;
      font-size: 2rem;
      background: none;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="bento-grid">

      <!-- 特大（横2×縦2）: バスケットボール部 -->
      <div class="bento-card large">
        <img src="https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=800&q=80" alt="バスケットボール部">
      </div>

      <!-- 縦長（横1×縦2）: 軽音楽部 -->
      <div class="bento-card row-span-2">
        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=600&q=80" alt="軽音楽部">
      </div>

      <!-- 正方形（横1×縦1）: 科学部 -->
      <div class="bento-card">
        <img src="https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&w=600&q=80" alt="科学部">
      </div>

      <!-- 正方形（横1×縦1）: バレーボール部 -->
      <div class="bento-card">
        <img src="https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?auto=format&fit=crop&w=600&q=80" alt="バレーボール部">
      </div>

      <!-- 横長（横2×縦1）: バドミントン部 -->
      <div class="bento-card col-span-2">
        <img src="https://images.unsplash.com/photo-1626224583764-f87db24ac4ea?auto=format&fit=crop&w=800&q=80" alt="バドミントン部">
      </div>

      <!-- 正方形（横1×縦1）: 卓球部 -->
      <div class="bento-card">
        <img src="https://images.unsplash.com/photo-1534158914592-062992fbe900?auto=format&fit=crop&w=600&q=80" alt="卓球部">
      </div>

      <!-- 縦長（横1×縦2）: 美術部 -->
      <div class="bento-card row-span-2">
        <img src="https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=600&q=80" alt="美術部">
      </div>

      <!-- 正方形（横1×縦1）: パソコン部 -->
      <div class="bento-card">
        <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=600&q=80" alt="パソコン部">
      </div>

      <!-- 横長（横2×縦1）: 吹奏楽部 -->
      <div class="bento-card col-span-2">
        <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=800&q=80" alt="吹奏楽部">
      </div>

      <!-- 正方形（横1×縦1）: ダンス部 -->
      <div class="bento-card">
        <img src="https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?auto=format&fit=crop&w=600&q=80" alt="ダンス部">
      </div>

      <!-- 正方形（横1×縦1）: ゴルフ部 -->
      <div class="bento-card">
        <img src="https://images.unsplash.com/photo-1535131749006-b7f58c99034b?auto=format&fit=crop&w=600&q=80" alt="ゴルフ部">
      </div>

      <!-- 横長（横2×縦1）: 生徒会 -->
      <div class="bento-card col-span-2">
        <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=800&q=80" alt="生徒会">
      </div>

    </div>
  </div>

  <!-- 画像拡大モーダル -->
  <div id="image-modal" class="modal-overlay" onclick="closeModal()">
    <div class="modal-content">
      <button class="modal-close">&times;</button>
      <img id="modal-img" src="" alt="拡大画像">
    </div>
  </div>

  <script>
    // 画像クリックで拡大表示
    document.querySelectorAll('.bento-card img').forEach(img => {
      img.addEventListener('click', (e) => {
        e.stopPropagation();
        const modal = document.getElementById('image-modal');
        const modalImg = document.getElementById('modal-img');
        modalImg.src = img.src;
        modal.classList.add('active');
      });
    });

    function closeModal() {
      document.getElementById('image-modal').classList.remove('active');
    }
  </script>
</body>
</html>
