<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東京都立小台橋高等学校 - 部活動フォトギャラリー</title>
<style>
:root {
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --card-radius: 16px;
    --text-main: #1e293b;
    --text-sub: #64748b;
    --accent-color: #0284c7;
    --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
    --shadow-hover: 0 20px 40px rgba(0, 0, 0, 0.15); /* ホバー時の動きを大きく強調 */
    --border-color: #e2e8f0;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background-color: var(--bg-color);
    color: var(--text-main);
    min-height: 100vh;
    padding: 3rem 1.5rem;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* サイトを開いたときに画像が出て緩やかに消える演出 */
.intro-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    pointer-events: none;
    animation: fadeOut 2.5s ease-in-out forwards;
}

.intro-overlay img {
    max-width: 80%;
    max-height: 80vh;
    border-radius: 16px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
}

@keyframes fadeOut {
    0% {
        opacity: 1;
    }
    70% {
        opacity: 1;
    }
    100% {
        opacity: 0;
        visibility: hidden;
    }
}

/* ヘッダー */
.header {
    text-align: center;
    margin-bottom: 2.5rem;
    max-width: 600px;
}

.header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 0.5rem;
    color: #0f172a;
}

.header p {
    color: var(--text-sub);
    font-size: 0.95rem;
}

/* Bento Grid レイアウト */
.container {
    width: 100%;
    max-width: 1200px;
}

.bento-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.5rem;
    grid-auto-rows: 240px;
    grid-auto-flow: dense;
}

.bento-card {
    background-color: var(--card-bg);
    border-radius: var(--card-radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    position: relative;
    cursor: pointer;
    border: 1px solid var(--border-color);
    /* ホバー時の動きをより大きくダイナミックに設定 */
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
}

.bento-card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: var(--shadow-hover);
}

.bento-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
}

.bento-card:hover img {
    transform: scale(1.05); /* カードの中の画像も連動して少し拡大 */
}

.card-content {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 1.25rem;
    background: linear-gradient(to top, rgba(15, 23, 42, 0.85) 0%, rgba(15, 23, 42, 0.4) 60%, transparent 100%);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
}

.card-tag {
    font-size: 0.75rem;
    background-color: rgba(255, 255, 255, 0.2);
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    width: fit-content;
    backdrop-filter: blur(4px);
}

.card-label {
    font-size: 1.1rem;
    font-weight: 700;
}

/* グリッドのサイズ調整用クラス */
.bento-card.col-span-2 { grid-column: span 2; }
.bento-card.row-span-2 { grid-row: span 2; }

@media (max-width: 768px) {
    .bento-grid {
        grid-template-columns: 1fr;
        grid-auto-rows: 220px;
    }
    .bento-card.col-span-2, 
    .bento-card.row-span-2 {
        grid-column: span 1;
        grid-row: span 1;
    }
}

/* モーダル */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
    z-index: 1000;
    padding: 1.5rem;
}

.modal-overlay.active {
    opacity: 1;
    visibility: visible;
}

.modal-content {
    position: relative;
    background-color: var(--card-bg);
    border-radius: var(--card-radius);
    max-width: 540px;
    width: 100%;
    overflow: hidden;
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
    border: 1px solid var(--border-color);
    color: var(--text-main);
}

.modal-content img {
    width: 100%;
    height: 260px;
    object-fit: cover;
}

.modal-body {
    padding: 1.75rem;
}

.modal-title {
    font-size: 1.4rem;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 0.75rem;
}

.modal-desc {
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--text-sub);
}

.modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    color: #0f172a;
    font-size: 1.2rem;
    background: #ffffff;
    width: 32px;
    height: 32px;
    border-radius: 4px;
    border: 1px solid var(--border-color);
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
}

.modal-close:hover {
    background: #f1f5f9;
}
</style>
</head>
<body>

    <!-- サイトを開いたときに出てきて消えるオープニング画像 -->
    <div class="intro-overlay">
        <img src="https://www.metro.ed.jp/odaibashi-he/img_sub/symbols_img4.jpg" alt="オープニング画像">
    </div>

    <header class="header">
        <h1>東京都立小台橋高等学校</h1>
        <p>部活動フォトギャラリー</p>
    </header>

    <main class="container">
        <div class="bento-grid">
            <!-- バスケットボール部 -->
            <div class="bento-card row-span-2" tabindex="0" role="button" data-tag="運動部" data-title="バスケットボール部" data-desc="火・水・金曜日の、昼休みと夕休み。土曜日の午前に活動。<br>1対1　3対3　レイアップなどの練習メニューが組まれている。">
                <img src="https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=800&q=80" alt="バスケットボール部">
                <div class="card-content">
                    <span class="card-tag">運動部</span>
                    <div class="card-label">バスケットボール部</div>
                </div>
            </div>

            <!-- 軽音楽部 -->
            <div class="bento-card row-span-2" tabindex="0" role="button" data-tag="文化部" data-title="軽音楽部" data-desc="水曜日と休日以外活動可能！練習のやる気があればいくらでもできる！<br>一部大会でも優勝を収めた強豪であると同時に、一人でやるだけでもOKなアットホームさも持っている良い部活です。">
                <img src="https://www.metro.ed.jp/odaibashi-he/assets/0531_%E8%BB%BD%E9%9F%B3%E6%A5%BD%E9%83%A81.jpg" alt="軽音楽部">
                <div class="card-content">
                    <span class="card-tag">文化部</span>
                    <div class="card-label">軽音楽部</div>
                </div>
            </div>

            <!-- 科学部 -->
            <div class="bento-card" tabindex="0" role="button" data-tag="文化部" data-title="科学部" data-desc="身近な疑問をテーマに実験を行い、日常の科学を探求しています。">
                <img src="https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&w=600&q=80" alt="科学部">
                <div class="card-content">
                    <span class="card-tag">文化部</span>
                    <div class="card-label">科学部</div>
                </div>
            </div>

            <!-- バレーボール部 -->
            <div class="bento-card" tabindex="0" role="button" data-tag="運動部" data-title="バレーボール部" data-desc="声を掛け合いながら基本技術と対人レシーブの向上を目指しています。">
                <img src="https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?auto=format&fit=crop&w=600&q=80" alt="バレーボール部">
                <div class="card-content">
                    <span class="card-tag">運動部</span>
                    <div class="card-label">バレーボール部</div>
                </div>
            </div>

            <!-- バドミントン部 -->
            <div class="bento-card col-span-2" tabindex="0" role="button" data-tag="運動部" data-title="バドミントン部" data-desc="フットワークやスマッシュなど、個々の技術を高めながら楽しく汗を流しています。">
                <img src="https://images.unsplash.com/photo-1626224583764-f87db24ac4ea?auto=format&fit=crop&w=800&q=80" alt="バドミントン部">
                <div class="card-content">
                    <span class="card-tag">運動部</span>
                    <div class="card-label">バドミントン部</div>
                </div>
            </div>

            <!-- 卓球部 -->
            <div class="bento-card" tabindex="0" role="button" data-tag="運動部" data-title="卓球部" data-desc="各大会で好成績を収めている。 <br>毎週金・土曜日に練習日があり、マシンを使った多球の打ち返し、課題練習、コーチとの練習など、各種設備が充実している。 <br>経験者未経験者問わず歓迎中。">
                <img src="https://www.metro.ed.jp/odaibashi-he/assets/%E5%86%99%E7%9C%9F%EF%BC%92.jpg" alt="卓球部">
                <div class="card-content">
                    <span class="card-tag">運動部</span>
                    <div class="card-label">卓球部</div>
                </div>
            </div>

            <!-- 美術部 -->
            <div class="bento-card row-span-2" tabindex="0" role="button" data-tag="文化部" data-title="美術部" data-desc="イラスト、油絵、立体制作など、それぞれが自由な作品制作に取り組んでいます。">
                <img src="https://thumb.photo-ac.com/43/4344562aa21ed24c739ef891d18c82b7_t.jpeg" alt="美術部">
                <div class="card-content">
                    <span class="card-tag">文化部</span>
                    <div class="card-label">美術部</div>
                </div>
            </div>

            <!-- パソコン部 -->
            <div class="bento-card" tabindex="0" role="button" data-tag="文化部" data-title="パソコン部" data-desc="主に情報処理技能検定について学んでいます。<br>資格の勉強を習慣にしたいなら是非。">
                <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=600&q=80" alt="パソコン部">
                <div class="card-content">
                    <span class="card-tag">文化部</span>
                    <div class="card-label">パソコン部</div>
                </div>
            </div>

            <!-- 吹奏楽部 -->
            <div class="bento-card col-span-2" tabindex="0" role="button" data-tag="文化部" data-title="吹奏楽部" data-desc="コンクールや文化祭での演奏に向けて、日々楽しく練習に励んでいます。">
                <img src="https://t4.ftcdn.net/jpg/01/62/31/93/360_F_162319353_BjQCCXp4m76NX7xFNYjbMZqaBCjw9xaB.jpg" alt="吹奏楽部">
                <div class="card-content">
                    <span class="card-tag">文化部</span>
                    <div class="card-label">吹奏楽部</div>
                </div>
            </div>

            <!-- ダンス部 -->
            <div class="bento-card" tabindex="0" role="button" data-tag="運動部" data-title="ダンス部" data-desc="リズム感を養いながら、文化祭ステージでのパフォーマンスを目指します。">
                <img src="https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?auto=format&fit=crop&w=600&q=80" alt="ダンス部">
                <div class="card-content">
                    <span class="card-tag">運動部</span>
                    <div class="card-label">ダンス部</div>
                </div>
            </div>

            <!-- ゴルフ部 -->
            <div class="bento-card" tabindex="0" role="button" data-tag="運動部" data-title="ゴルフ部" data-desc="きれいなスイングフォームの習得を目指して基礎練習を行っています。">
                <img src="https://images.unsplash.com/photo-1535131749006-b7f58c99034b?auto=format&fit=crop&w=600&q=80" alt="ゴルフ部">
                <div class="card-content">
                    <span class="card-tag">運動部</span>
                    <div class="card-label">ゴルフ部</div>
                </div>
            </div>

            <!-- ソフトテニス部 -->
            <div class="bento-card" tabindex="0" role="button" data-tag="運動部" data-title="ソフトテニス部" data-desc="コートを走り回り、ペアで息を合わせたプレイを目指して楽しく練習しています。">
                <img src="https://images.unsplash.com/photo-1622279457486-62dcc4a431d6?auto=format&fit=crop&w=600&q=80" alt="ソフトテニス部">
                <div class="card-content">
                    <span class="card-tag">運動部</span>
                    <div class="card-label">ソフトテニス部</div>
                </div>
            </div>

            <!-- 演劇部 -->
            <div class="bento-card row-span-2" tabindex="0" role="button" data-tag="文化部" data-title="演劇部" data-desc="舞台の表から裏まで、みんなで一つの作品を創り上げる喜びを分かち合います。">
                <img src="https://game-materials.com/wp-content/uploads/2026/03/The-area-on-the-stage-where-the-stun-light-hit1-1024x576.jpg" alt="演劇部">
                <div class="card-content">
                    <span class="card-tag">文化部</span>
                    <div class="card-label">演劇部</div>
                </div>
            </div>

            <!-- サッカー部 -->
            <div class="bento-card col-span-2" tabindex="0" role="button" data-tag="運動部" data-title="サッカー部" data-desc="人工芝を使える">
                <img src="https://t4.ftcdn.net/jpg/02/12/80/49/360_F_212804949_51qynNo47p3QwUkhzqAlBN6h2gtEakvW.jpg" alt="サッカー部">
                <div class="card-content">
                    <span class="card-tag">運動部</span>
                    <div class="card-label">サッカー部</div>
                </div>
            </div>

            <!-- 伝統芸能部 -->
            <div class="bento-card" tabindex="0" role="button" data-tag="文化部" data-title="伝統芸能部" data-desc="芽吹祭での発表を目標に週一水曜日に和楽器の練習をしています。　<br>三味線やお琴、締太鼓をやってみたい人はぜひ。">
                <img src="https://www.free-materials.com/adm/wp-content/uploads/2020/01/adpDSC_2714-.jpg" alt="伝統芸能部">
                <div class="card-content">
                    <span class="card-tag">文化部</span>
                    <div class="card-label">茶道部</div>
                </div>
            </div>

            <!-- デジタルイラスト部 -->
            <div class="bento-card" tabindex="0" role="button" data-tag="文化部" data-title="デジタルイラスト部" data-desc="デザイン実習室で、水曜12:30~13:10に活動中。<br>文化祭、コミックマーケットなどで活動のアウトプットの場も作っています。<br>デジタルイラストに関連する機器は持参なので注意！">
                <img src="https://thumb.ac-illust.com/84/846cb73a6af0aa34253f779e121ebb1d_t.jpeg" alt="デジタルイラスト部">
                <div class="card-content">
                    <span class="card-tag">文化部</span>
                    <div class="card-label">デジタルイラスト部</div>
                </div>
            </div>
        </div>
    </main>

    <!-- モーダルウィンドウ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">×</button>
            <img id="modalImg" src="" alt="">
            <div class="modal-body">
                <span class="card-tag" id="modalTag" style="background-color: var(--accent-color); color: white; margin-bottom: 0.5rem; display: inline-block;"></span>
                <h2 class="modal-title" id="modalTitle"></h2>
                <p class="modal-desc" id="modalDesc"></p>
            </div>
        </div>
    </div>

    <script>
        const cards = document.querySelectorAll('.bento-card');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalClose = document.getElementById('modalClose');
        const modalImg = document.getElementById('modalImg');
        const modalTag = document.getElementById('modalTag');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');

        cards.forEach(card => {
            card.addEventListener('click', () => {
                const img = card.querySelector('img').src;
                const tag = card.dataset.tag;
                const title = card.dataset.title;
                const desc = card.dataset.desc;

                modalImg.src = img;
                modalTag.textContent = tag;
                modalTitle.textContent = title;
                modalDesc.innerHTML = desc;

                modalOverlay.classList.add('active');
            });
        });

        modalClose.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });
    </script>
</body>
</html>
